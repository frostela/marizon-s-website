<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
</head>

<style>
    
    *{
        padding: 0;
        margin: 0;
        border: 0;
    }

        @font-face {
        font-family: 'Avro';
        src: url(Arvo.ttf);
        font-display: swap;
    }

    .page_404 {
        padding: 40px 0;
        background: #fff;
        font-family: 'Arvo', serif;
        text-align: center;
    }

    .page_404 img {
        width: 100%;
    }

    .four_zero_four_bg {

        background-image: url(https://cdn.dribbble.com/users/285475/screenshots/2083086/dribbble_1.gif);
        height: 400px;
        background-position: center;
    }


    .four_zero_four_bg h1 {
        font-size: 80px;
    }

    .four_zero_four_bg h3 {
        font-size: 80px;
    }

    .link_404 {
        color: #fff !important;
        padding: 10px 20px;
        background: #39ac31;
        margin: 20px 0;
        display: inline-block;
        text-decoration: none;
    }

    .contant_box_404 {
        margin-top: -50px;
    }

</style>

<body>
    <section class="page_404">
        <div class="container">
            <div class="row">
                <div class="col-sm-12 ">
                    <div class="col-sm-10 col-sm-offset-1  text-center">
                        <div class="four_zero_four_bg">
                            <h1 class="text-center ">404</h1>


                        </div>

                        <div class="contant_box_404">
                            <h3 class="h2">
                                Look like you're lost
                            </h3>

                            <p>the page you are looking for not avaible!</p>

                            <a href="./" class="link_404">Go to Home</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

<script>
    // Place this script in your main JavaScript file or in a script tag in your HTML files
    window.onload = function () {
        if (document.querySelector("title").innerHTML === "404 Not Found") return; // Prevent infinite loop
        var xhr = new XMLHttpRequest();
        xhr.open("GET", window.location.href, true);
        xhr.onreadystatechange = function () {
            if (xhr.readyState == 4 && xhr.status == 404) {
                window.location.href = "/404.html"; // Redirect to the 404 page
            }
        }
        xhr.send();
    }

</script>

</html>
