<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <link rel="stylesheet" href="styles.css"> <!-- Include your CSS file if you have one -->
</head>

<body>
    <h1>404 - Page Not Found</h1>
    <p>The page you are looking for does not exist.</p>
    <!-- Add any additional content or navigation links here -->
    <a href="./">
        <h3>Go back</h1>
    </a>
</body>

<script>
    // Place this script in your main JavaScript file or in a script tag in your HTML files
    window.onload = function () {
        if (document.querySelector("title").innerHTML === "404 Not Found") return; // Prevent infinite loop
        var xhr = new XMLHttpRequest();
        xhr.open("GET", window.location.href, true);
        xhr.onreadystatechange = function () {
            if (xhr.readyState == 4 && xhr.status == 404) {
                window.location.href = "/404.html"; // Redirect to the 404 page
            }
        }
        xhr.send();
    }

</script>

</html>
